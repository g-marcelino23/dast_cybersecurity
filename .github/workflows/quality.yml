name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Ruff
        run: python -m ruff check backend/app backend/tests
      - name: Mypy
        run: python -m mypy backend/app
      - name: Tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend · Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Audit production dependencies
        run: npm audit --prefix frontend --omit=dev
      - name: Tests
        run: npm test --prefix frontend
      - name: Typecheck
        run: npm run typecheck --prefix frontend
      - name: Lint
        run: npm run lint --prefix frontend
      - name: Build
        run: npm run build --prefix frontend
