[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dast-platform"
version = "0.23.0"
description = "Dynamic application security scanner for authorized web applications and APIs"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.38,<2.1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "httpx==0.28.1",
  "psycopg[binary]>=3.2.6,<4", "python-dotenv>=1.0,<2",
  "playwright>=1.52,<2", "alembic>=1.15,<2",
  "cryptography>=45,<47",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
